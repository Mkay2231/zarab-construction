<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#176B3A" />
    <link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <title>Zarab Construction Company Ltd.</title>
    <!-- Per-page <title>, description and Open Graph tags are rendered by src/components/Common/Seo.jsx -->
    <meta property="og:site_name" content="Zarab Construction Company Ltd." />
  </head>
  <body>
    <noscript>This website requires JavaScript. Please enable it to view Zarab Construction Company Ltd.</noscript>
    <div id="root"></div>
    <!--
      Netlify Forms detection: Netlify scans this static markup at deploy time to
      register the "enquiry" form. The visible form is rendered by React
      (src/components/Forms/ContactForm.jsx) and posts the same field names.
      Harmless on other hosts.
    -->
    <form name="enquiry" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="bot-field" />
      <input type="text" name="fullName" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <input type="text" name="company" />
      <input type="text" name="projectType" />
      <input type="text" name="location" />
      <textarea name="details"></textarea>
      <input type="text" name="method" />
      <input type="text" name="consent" />
      <input type="text" name="submittedAt" />
    </form>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
